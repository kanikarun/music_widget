<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Widget Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="assets/icons/music.png" type="image/png">
</head>

<body>

    <div class="admin-container">
        <header class="admin-header">
            <h1>🎵 Widget Admin Panel</h1>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">Back to Player</a>
                <button id="save-btn" class="btn btn-primary">💾 Save Playlist</button>
            </div>
        </header>

        <main class="splitter">
            <!-- Add/Edit Track Section -->
            <section class="admin-section form-section">
                <h2 id="form-title">Add New Track</h2>
                <form id="add-track-form">
                    <input type="hidden" id="track-id">

                    <div class="form-grid-vertical">
                        <div class="form-group">
                            <label for="title">Track Title</label>
                            <input type="text" id="title" name="title" required placeholder="e.g. Flower">
                        </div>

                        <div class="form-group">
                            <label for="artist">Artist</label>
                            <input type="text" id="artist" name="artist" required placeholder="e.g. aespa">
                        </div>

                        <div class="form-group row-group">
                            <label class="file-upload-label" for="src-file">
                                <span class="upload-icon">🎵</span>
                                <span id="src-text">Audio File...</span>
                                <input type="file" id="src-file" accept="audio/*,video/*" class="file-input-hidden">
                            </label>
                            <input type="hidden" id="src" name="src" required>
                        </div>

                        <div class="form-group row-group">
                            <label class="file-upload-label" for="cover-file">
                                <span class="upload-icon">🖼️</span>
                                <span id="cover-text">Cover Image...</span>
                                <input type="file" id="cover-file" accept="image/*" class="file-input-hidden">
                            </label>
                            <input type="hidden" id="cover" name="cover" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
                        <button type="submit" id="submit-btn" class="btn btn-success">➕ Add Track</button>
                    </div>
                </form>
            </section>

            <!-- Existing Tracks Section -->
            <section class="admin-section table-section">
                <div class="section-header">
                    <h2>Playlist (<span id="track-count">0</span>)</h2>
                    <div class="search-box">
                        <input type="text" id="admin-search" placeholder="Search...">
                    </div>
                </div>

                <div class="table-container">
                    <table class="tracks-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">ID</th>
                                <th style="width: 70px;">Image</th>
                                <th>File Info</th>
                                <th style="width: 120px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tracks-body">
                            <!-- Tracks injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/admin.js" defer></script>
</body>

</html>
